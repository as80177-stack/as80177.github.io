backend:
  name: github
  repo: as80177-stack/as80177.github.io
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

locale: zh_Hant
media_folder: static/images
public_folder: /images

collections:
  - name: homilies
    label: 講道與道理筆記
    files:
      - label: 甲年
        name: year-a
        file: data/year-a.json
        fields: &cycle_fields
          - { label: 週期代碼, name: cycle, widget: hidden }
          - { label: 週期名稱, name: label, widget: hidden }
          - label: 主日資料夾
            name: sundays
            widget: list
            label_singular: 一個主日
            summary: "{{fields.display_name}}"
            collapsed: true
            fields: &note_folder_fields
              - { label: 識別碼, name: id, widget: hidden }
              - { label: 主日編號, name: number, widget: number, value_type: int, required: false }
              - { label: 名稱, name: name, widget: string }
              - { label: 資料夾名稱, name: display_name, widget: string }
              - &homily_list
                label: 多個道理版本
                name: homilies
                widget: list
                label_singular: 新增一個版本
                summary: "{{fields.title}}"
                collapsed: true
                required: false
                fields:
                  - { label: 版本名稱, name: title, widget: string, hint: "例如：諸聖節道理 1、兒童版、青年版。" }
                  - { label: 道理適用年別, name: liturgical_parity, widget: select, required: false, options: [{ label: 單數年, value: odd }, { label: 雙數年, value: even }], hint: "請依原稿年份選擇；不要用上傳年份推定。標題只顯示單-或雙-。" }
                  - { label: 原稿年份, name: composition_year, widget: number, value_type: int, required: false, hint: "例如2023為單數，2022為雙數。不確定可留空。" }
                  - { label: 上傳時間, name: uploaded_at, widget: datetime, date_format: "YYYY-MM-DD", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ", hint: "新增版本時請保留目前的日期與時間。" }
                  - { label: 道理正文, name: content, widget: text, hint: "支援長篇內容，可輸入至少 1200 個中文字；可直接分段換行。" }
                  - label: 翻譯（選填）
                    name: translations
                    widget: object
                    required: false
                    fields:
                      - label: English
                        name: en
                        widget: object
                        required: false
                        fields:
                          - { label: 英文標題, name: title, widget: string }
                          - { label: 英文全文, name: content, widget: text }
          - label: 平日資料夾
            name: weekdays
            widget: object
            collapsed: true
            fields:
              - { label: 名稱, name: label, widget: hidden }
              - label: 第1週至第34週
                name: weeks
                widget: list
                label_singular: 一週
                summary: "{{fields.name}}"
                collapsed: true
                fields: &week_folder_fields
                  - { label: 識別碼, name: id, widget: hidden }
                  - { label: 週次, name: number, widget: number, value_type: int }
                  - { label: 資料夾名稱, name: name, widget: string }
                  - label: 星期一至星期六
                    name: days
                    widget: list
                    label_singular: 一天
                    summary: "{{fields.label}}"
                    collapsed: true
                    fields:
                      - { label: 日期代碼, name: id, widget: hidden }
                      - { label: 星期, name: label, widget: string }
                      - *homily_list
          - label: 將臨期平日
            name: advent_weekdays
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: 分類名稱, name: label, widget: string }
              - label: 第一至第四週
                name: weeks
                widget: list
                summary: "{{fields.name}}"
                fields: *week_folder_fields
          - label: 四旬期平日
            name: lent_weekdays
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: 分類名稱, name: label, widget: string }
              - label: 第一至第五週
                name: weeks
                widget: list
                summary: "{{fields.name}}"
                fields: *week_folder_fields
          - label: 聖週
            name: holy_week
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: 分類名稱, name: label, widget: string }
              - label: 聖週資料夾
                name: weeks
                widget: list
                summary: "{{fields.name}}"
                fields: *week_folder_fields
          - label: 其他（各種節日）
            name: other
            widget: list
            label_singular: 一個節日
            summary: "{{fields.display_name}}"
            collapsed: true
            fields: *note_folder_fields
      - label: 乙年
        name: year-b
        file: data/year-b.json
        fields: *cycle_fields
      - label: 丙年
        name: year-c
        file: data/year-c.json
        fields: *cycle_fields
      - label: 12宗徒（獨立分類）
        name: apostles
        file: data/apostles.json
        fields:
          - { label: 分類名稱, name: label, widget: string }
          - label: 資料夾
            name: folders
            widget: list
            summary: "{{fields.display_name}}"
            fields: *note_folder_fields
      - label: 聖母其他節日（獨立分類）
        name: marian
        file: data/marian.json
        fields:
          - { label: 分類名稱, name: label, widget: string }
          - label: 資料夾
            name: folders
            widget: list
            summary: "{{fields.display_name}}"
            fields: *note_folder_fields
      - label: 其他神學與生活道理（獨立分類）
        name: theology
        file: data/theology.json
        fields:
          - { label: 分類名稱, name: label, widget: string }
          - label: 資料夾
            name: folders
            widget: list
            summary: "{{fields.display_name}}"
            fields: *note_folder_fields
