backend:
  name: github
  repo: as80177-stack/as80177.github.io   # 你的帳號/倉庫名稱
  branch: main
  base_url: https://api.netlify.com        # 暫時用這個，後面會說明
  auth_endpoint: auth

media_folder: static/images
public_folder: /images

collections:
  - name: "year-a"
    label: "甲年講道筆記"
    folder: "data"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "識別碼 (id)", name: "id", widget: "string" }
      - { label: "主日名稱", name: "name", widget: "string" }
      - { label: "禮儀時期", name: "season", widget: "string" }
      - { label: "第幾主日", name: "week", widget: "number", required: false }
      - label: "讀經"
        name: "readings"
        widget: "object"
        fields:
          - { label: "讀經一", name: "first", widget: "string" }
          - { label: "答唱詠", name: "psalm", widget: "string" }
          - { label: "讀經二", name: "second", widget: "string" }
          - { label: "福音", name: "gospel", widget: "string" }
      - { label: "講道筆記", name: "homily_notes", widget: "text" }
      - { label: "關鍵字", name: "keywords", widget: "list", required: false }

  - name: "year-b"
    label: "乙年講道筆記"
    folder: "data"
    extension: "json"
    format: "json"
    create: true
    fields:
      - { label: "識別碼 (id)", name: "id", widget: "string" }
      - { label: "主日名稱", name: "name", widget: "string" }
      - { label: "禮儀時期", name: "season", widget: "string" }
      - { label: "第幾主日", name: "week", widget: "number", required: false }
      - label: "讀經"
        name: "readings"
        widget: "object"
        fields:
          - { label: "讀經一", name: "first", widget: "string" }
          - { label: "答唱詠", name: "psalm", widget: "string" }
          - { label: "讀經二", name: "second", widget: "string" }
          - { label: "福音", name: "gospel", widget: "string" }
      - { label: "講道筆記", name: "homily_notes", widget: "text" }
      - { label: "關鍵字", name: "keywords", widget: "list", required: false }

  - name: "year-c"
    label: "丙年講道筆記"
    folder: "data"
    extension: "json"
    format: "json"
    create: true
    fields:
      - { label: "識別碼 (id)", name: "id", widget: "string" }
      - { label: "主日名稱", name: "name", widget: "string" }
      - { label: "禮儀時期", name: "season", widget: "string" }
      - { label: "第幾主日", name: "week", widget: "number", required: false }
      - label: "讀經"
        name: "readings"
        widget: "object"
        fields:
          - { label: "讀經一", name: "first", widget: "string" }
          - { label: "答唱詠", name: "psalm", widget: "string" }
          - { label: "讀經二", name: "second", widget: "string" }
          - { label: "福音", name: "gospel", widget: "string" }
      - { label: "講道筆記", name: "homily_notes", widget: "text" }
      - { label: "關鍵字", name: "keywords", widget: "list", required: false }
