backend:
  name: github
  repo: as80177-stack/as80177.github.io
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

locale: zh_Hant

media_folder: static/images
public_folder: /images

collections:
  - name: homilies
    label: 講道筆記
    files:
      - label: 甲年講道筆記
        name: year-a
        file: data/year-a.json
        fields: &homily_fields
          - label: 主日與講道
            name: items
            widget: list
            label_singular: 一篇講道
            summary: "{{fields.name}}"
            fields:
              - { label: "識別碼 (id)", name: id, widget: string }
              - { label: 主日名稱, name: name, widget: string }
              - { label: 禮儀時期, name: season, widget: string }
              - { label: 第幾主日, name: week, widget: number, required: false, value_type: int }
              - label: 讀經
                name: readings
                widget: object
                fields:
                  - { label: 讀經一, name: first, widget: string }
                  - { label: 答唱詠, name: psalm, widget: string }
                  - { label: 讀經二, name: second, widget: string }
                  - { label: 福音, name: gospel, widget: string }
              - { label: 講道筆記, name: homily_notes, widget: text }
              - { label: 關鍵字, name: keywords, widget: list, required: false, default: [] }
      - label: 乙年講道筆記
        name: year-b
        file: data/year-b.json
        fields: *homily_fields
      - label: 丙年講道筆記
        name: year-c
        file: data/year-c.json
        fields: *homily_fields
