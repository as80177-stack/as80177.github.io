backend:
  name: github
  repo: as80177-stack/as80177.github.io
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

locale: zh_Hant
media_folder: static/images
public_folder: /images

collections:
  - name: homilies
    label: 講道與道理筆記
    files:
      - label: 甲年
        name: year-a
        file: data/year-a.json
        fields: &cycle_fields
          - { label: 週期代碼, name: cycle, widget: hidden }
          - { label: 週期名稱, name: label, widget: hidden }
          - label: 主日資料夾
            name: sundays
            widget: list
            label_singular: 一個主日
            summary: "{{fields.display_name}}"
            collapsed: true
            fields: &note_folder_fields
              - { label: 識別碼, name: id, widget: hidden }
              - { label: 主日編號, name: number, widget: number, value_type: int, required: false }
              - { label: 名稱, name: name, widget: string }
              - { label: 資料夾名稱, name: display_name, widget: string }
              - &homily_list
                label: 多篇講道與道理
                name: homilies
                widget: list
                label_singular: 一篇道理
                summary: "{{fields.date}} · {{fields.category}} · {{fields.title}}"
                collapsed: true
                required: false
                fields:
                  - { label: 標題, name: title, widget: string }
                  - { label: 日期, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
                  - { label: 類別, name: category, widget: select, options: [講道, 道理, 分享, 其他], default: 道理 }
                  - { label: 正文, name: content, widget: text, hint: "支援長篇內容，可輸入至少 1200 個中文字；可直接分段換行。" }
                  - { label: 關鍵字, name: keywords, widget: list, required: false, default: [] }
          - label: 平日資料夾
            name: weekdays
            widget: object
            collapsed: true
            fields:
              - label: 單數年平日
                name: odd
                widget: object
                collapsed: true
                fields: &parity_fields
                  - { label: 名稱, name: label, widget: hidden }
                  - label: 第1週至第34週
                    name: weeks
                    widget: list
                    label_singular: 一週
                    summary: "{{fields.name}}"
                    collapsed: true
                    fields:
                      - { label: 識別碼, name: id, widget: hidden }
                      - { label: 週次, name: number, widget: number, value_type: int }
                      - { label: 資料夾名稱, name: name, widget: string }
                      - label: 星期一至星期六
                        name: days
                        widget: list
                        label_singular: 一天
                        summary: "{{fields.label}}"
                        collapsed: true
                        fields:
                          - { label: 日期代碼, name: id, widget: hidden }
                          - { label: 星期, name: label, widget: string }
                          - *homily_list
              - label: 雙數年平日
                name: even
                widget: object
                collapsed: true
                fields: *parity_fields
          - label: 其他（各種節日）
            name: other
            widget: list
            label_singular: 一個節日
            summary: "{{fields.display_name}}"
            collapsed: true
            fields: *note_folder_fields
      - label: 乙年
        name: year-b
        file: data/year-b.json
        fields: *cycle_fields
      - label: 丙年
        name: year-c
        file: data/year-c.json
        fields: *cycle_fields
