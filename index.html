<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天主教講道筆記</title>
  <style>
    body {
      font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      line-height: 1.7;
      color: #222;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      color: #666;
      margin-bottom: 2rem;
    }
    .card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    a {
      color: #0b5ed7;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>天主教講道筆記</h1>
  <p class="subtitle">Catholic Homily Recorder · 甲乙丙年講道與彌撒流程</p>

  <div class="card">
    <h2>今日禮儀</h2>
    <p id="today">載入中…</p>
  </div>

  <div class="card">
    <h2>功能（建置中）</h2>
    <ul>
      <li>甲年 / 乙年 / 丙年主日講道筆記</li>
      <li>彌撒流程（普通禮）</li>
      <li>依日期自動顯示當日內容</li>
    </ul>
  </div>

  <p style="color:#888; font-size:0.9rem;">網站已成功部署於 GitHub Pages</p>

  <script>
    const now = new Date();
    const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    document.getElementById('today').textContent =
      now.toLocaleDateString('zh-TW', options);
  </script>
</body>
</html>
