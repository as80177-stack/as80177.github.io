<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天主教講道筆記</title>
  <meta name="theme-color" content="#72551f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="講道筆記">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">
  <style>
    body {
      font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      line-height: 1.7;
      color: #222;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      color: #666;
      margin-bottom: 2rem;
    }
    .card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    a {
      color: #0b5ed7;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .button {
      display: inline-block;
      padding: 0.65rem 1rem;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #72551f;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
    }
    .button.secondary { background: #657468; }
    .button:hover { text-decoration: none; filter: brightness(1.08); }
    [hidden] { display: none !important; }
    .install-help { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>天主教講道筆記</h1>
  <p class="subtitle">Catholic Homily Recorder · 甲乙丙年講道與彌撒流程</p>

  <div class="card">
    <h2>今日禮儀</h2>
    <p id="today">載入中…</p>
  </div>

  <div class="card">
    <h2>講道與道理筆記</h2>
    <ul>
      <li>甲年、乙年、丙年主日筆記</li>
      <li>單數年、雙數年平日筆記</li>
      <li>主要節日與特殊禮儀日筆記</li>
    </ul>
    <div class="actions">
      <a class="button" href="homily.html">開啟講道筆記</a>
      <a class="button secondary" href="admin/">管理後台</a>
      <button class="button" id="installButton" type="button" hidden>安裝 App</button>
    </div>
    <p class="install-help">手機若沒有顯示安裝按鈕，可使用瀏覽器選單的「加入主畫面」。</p>
  </div>

  <p style="color:#888; font-size:0.9rem;">網站已成功部署於 GitHub Pages</p>

  <script>
    const now = new Date();
    const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    document.getElementById('today').textContent =
      now.toLocaleDateString('zh-TW', options);

    let installPrompt;
    const installButton = document.getElementById('installButton');
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      installPrompt = event;
      installButton.hidden = false;
    });
    installButton.addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installButton.hidden = true;
    });
    window.addEventListener('appinstalled', () => {
      installButton.hidden = true;
      installPrompt = null;
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
