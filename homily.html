<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講道與道理筆記</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; max-width: 920px; margin: 0 auto; padding: 1.5rem; line-height: 1.6; color: #24211d; background: #f7f4ef; }
    a.back { display: inline-block; margin-bottom: 1rem; color: #72551f; text-decoration: none; }
    h1 { margin: 0 0 .25rem; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .subtitle { color: #6d675e; margin: 0 0 1rem; }
    .current { padding: .8rem 1rem; margin-bottom: 1rem; border-left: 4px solid #9b762d; border-radius: 6px; background: #fff9e9; }
    .toolbar { display: grid; grid-template-columns: minmax(150px, .5fr) 1fr; gap: .8rem; padding: 1rem; margin-bottom: 1rem; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgb(55 45 30 / 8%); }
    .toolbar label { font-weight: 650; }
    select, input[type="search"] { width: 100%; margin-top: .25rem; padding: .65rem .75rem; border: 1px solid #cfc7bb; border-radius: 8px; background: #fff; font: inherit; }
    .folder { overflow: hidden; margin-bottom: .8rem; border: 1px solid #ded7cc; border-radius: 12px; background: #fff; box-shadow: 0 1px 4px rgb(55 45 30 / 6%); }
    .folder-button, .subfolder-button { display: flex; width: 100%; align-items: center; gap: .7rem; border: 0; color: inherit; background: transparent; text-align: left; cursor: pointer; font: inherit; }
    .folder-button { padding: 1rem 1.1rem; }
    .subfolder-button { padding: .8rem 1rem; background: #f3f7f3; }
    .folder-button:hover, .subfolder-button:hover { filter: brightness(.98); }
    .folder-icon { font-size: 1.3rem; }
    .folder-title { flex: 1; font-weight: 750; }
    .chevron { transition: transform .18s; }
    .folder.open > .folder-button .chevron, .subfolder.open > .subfolder-button .chevron { transform: rotate(90deg); }
    .folder-content { display: none; padding: 0 1rem 1rem; }
    .folder.open > .folder-content { display: grid; gap: .7rem; }
    .day { padding: .85rem 1rem; border-left: 4px solid #c4a45c; border-radius: 7px; background: #faf8f4; }
    .day h3 { margin: 0 0 .35rem; font-size: 1rem; }
    .notes { margin: 0; white-space: pre-wrap; }
    .empty-note { color: #8b857d; }
    .subfolder { overflow: hidden; border: 1px solid #d5ded6; border-radius: 9px; }
    .subfolder.current-parity { border-color: #66866e; box-shadow: 0 0 0 2px rgb(102 134 110 / 12%); }
    .days { display: none; padding: .7rem; background: #fff; }
    .subfolder.open .days { display: grid; gap: .55rem; }
    .weekday { border-left-color: #7d9a83; }
    .badge { padding: .1rem .45rem; border-radius: 999px; color: #356040; background: #dfece2; font-size: .75rem; }
    .keywords { margin-top: .5rem; }
    .keyword { display: inline-block; padding: .1rem .5rem; margin: .1rem .15rem 0 0; border-radius: 999px; background: #e9e4da; font-size: .8rem; }
    .message { padding: 2rem; color: #6d675e; text-align: center; }
    .error { color: #a32c2c; }
    @media (max-width: 560px) { body { padding: 1rem; } .toolbar { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <a class="back" href="index.html">← 回首頁</a>
  <h1>講道與道理筆記</h1>
  <p class="subtitle">甲、乙、丙年各有 34 個主日資料夾，每個主日包含單數年與雙數年平日</p>

  <div id="currentCycle" class="current"></div>

  <div class="toolbar">
    <label>
      主日禮儀年
      <select id="cycleSelect">
        <option value="a">甲年</option>
        <option value="b">乙年</option>
        <option value="c">丙年</option>
      </select>
    </label>
    <label>
      搜尋資料夾或筆記
      <input type="search" id="searchInput" placeholder="例如：第5主日、祈禱、星期一">
    </label>
  </div>

  <main id="list"><div class="message">載入中…</div></main>

  <script>
    const cycleSelect = document.getElementById('cycleSelect');
    const searchInput = document.getElementById('searchInput');
    const currentCycle = document.getElementById('currentCycle');
    const listEl = document.getElementById('list');
    let weeks = [];
    let detected;

    function firstSundayOfAdvent(year) {
      const date = new Date(year, 10, 27);
      date.setDate(date.getDate() + ((7 - date.getDay()) % 7));
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function liturgicalSettings(date = new Date()) {
      const calendarYear = date.getFullYear();
      const liturgicalYear = date >= firstSundayOfAdvent(calendarYear) ? calendarYear + 1 : calendarYear;
      return {
        liturgicalYear,
        sunday: liturgicalYear % 3 === 1 ? 'a' : liturgicalYear % 3 === 2 ? 'b' : 'c',
        weekday: liturgicalYear % 2 === 1 ? 'odd' : 'even'
      };
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[char]);
    }

    function noteHtml(item, cssClass = '') {
      const note = item.homily_notes?.trim();
      return `
        <article class="day ${cssClass}">
          <h3>${escapeHtml(item.label)}</h3>
          <p class="notes ${note ? '' : 'empty-note'}">${escapeHtml(note || '尚未加入筆記')}</p>
          ${item.keywords?.length ? `
            <div class="keywords">${item.keywords.map(word => `<span class="keyword">${escapeHtml(word)}</span>`).join('')}</div>
          ` : ''}
        </article>
      `;
    }

    function weekdayFolderHtml(folder, parity) {
      const isCurrent = detected.weekday === parity;
      return `
        <section class="subfolder ${isCurrent ? 'current-parity' : ''}">
          <button class="subfolder-button" type="button" aria-expanded="false">
            <span class="folder-icon">📂</span>
            <span class="folder-title">${escapeHtml(folder.label)}</span>
            ${isCurrent ? '<span class="badge">目前週期</span>' : ''}
            <span class="chevron">›</span>
          </button>
          <div class="days">
            ${folder.days.map(day => noteHtml(day, 'weekday')).join('')}
          </div>
        </section>
      `;
    }

    async function loadData() {
      listEl.innerHTML = '<div class="message">載入中…</div>';
      try {
        const response = await fetch(`data/year-${cycleSelect.value}.json`);
        if (!response.ok) throw new Error('找不到禮儀年資料');
        const data = await response.json();
        weeks = data.weeks;
        render();
      } catch (error) {
        listEl.innerHTML = `<div class="message error">載入失敗：${escapeHtml(error.message)}</div>`;
      }
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const visible = weeks.filter(week => {
        const allDays = [week.sunday, ...week.weekdays.odd.days, ...week.weekdays.even.days];
        const text = [week.name, week.display_name, ...allDays.flatMap(day => [day.label, day.homily_notes, ...(day.keywords || [])])].join(' ').toLowerCase();
        return !query || text.includes(query);
      });

      if (!visible.length) {
        listEl.innerHTML = '<div class="message">沒有符合的資料夾或筆記</div>';
        return;
      }

      listEl.innerHTML = visible.map(week => `
        <section class="folder">
          <button class="folder-button" type="button" aria-expanded="false">
            <span class="folder-icon">📁</span>
            <span class="folder-title">${escapeHtml(week.display_name)}</span>
            <span class="chevron">›</span>
          </button>
          <div class="folder-content">
            ${noteHtml(week.sunday)}
            ${weekdayFolderHtml(week.weekdays.odd, 'odd')}
            ${weekdayFolderHtml(week.weekdays.even, 'even')}
          </div>
        </section>
      `).join('');

      listEl.querySelectorAll('.folder-button, .subfolder-button').forEach(button => {
        button.addEventListener('click', () => {
          const container = button.parentElement;
          const open = container.classList.toggle('open');
          button.setAttribute('aria-expanded', String(open));
        });
      });
    }

    detected = liturgicalSettings();
    cycleSelect.value = detected.sunday;
    const sundayLabel = { a: '甲年', b: '乙年', c: '丙年' }[detected.sunday];
    const weekdayLabel = detected.weekday === 'odd' ? '單數年' : '雙數年';
    currentCycle.textContent = `目前禮儀年度：${detected.liturgicalYear} 年 · ${sundayLabel}主日 · ${weekdayLabel}平日`;

    cycleSelect.addEventListener('change', loadData);
    searchInput.addEventListener('input', render);
    loadData();
  </script>
</body>
</html>
