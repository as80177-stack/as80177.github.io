<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講道與道理筆記</title>
  <meta name="theme-color" content="#72551f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="reader.css">
  <style>
    :root { --reading-font-size: 1.1rem; --reading-line-height: 1.8; }
    * { box-sizing: border-box; }
    body[data-reading-size="small"] { --reading-font-size: .95rem; --reading-line-height: 1.7; }
    body[data-reading-size="medium"] { --reading-font-size: 1.1rem; --reading-line-height: 1.8; }
    body[data-reading-size="large"] { --reading-font-size: 1.35rem; --reading-line-height: 1.95; }
    body { font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; max-width: 920px; margin: 0 auto; padding: 1.5rem; line-height: 1.6; color: #24211d; background: #f7f4ef; }
    a.back { display: inline-block; margin-bottom: 1rem; color: #72551f; text-decoration: none; }
    h1 { margin: 0 0 .25rem; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .subtitle { color: #6d675e; margin: 0 0 1rem; }
    .current { padding: .8rem 1rem; margin-bottom: 1rem; border-left: 4px solid #9b762d; border-radius: 6px; background: #fff9e9; }
    .reading-settings { display: flex; align-items: center; flex-wrap: wrap; gap: .45rem; margin-bottom: 1rem; padding: .7rem 1rem; border-radius: 10px; background: #fff; box-shadow: 0 1px 4px rgb(55 45 30 / 6%); }
    .reading-label { margin-right: .25rem; color: #5f584e; font-weight: 700; }
    .size-button { min-width: 4.2rem; padding: .45rem .7rem; border: 1px solid #cfc7bb; border-radius: 999px; color: #403a32; background: #fff; cursor: pointer; font: inherit; }
    .size-button:hover { background: #fff8e8; }
    .size-button[aria-pressed="true"] { border-color: #72551f; color: #fff; background: #72551f; }
    .size-button[data-size="small"] { font-size: .85rem; }
    .size-button[data-size="large"] { font-size: 1.12rem; }
    .inline-reading-settings { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem; padding: .65rem 0; }
    .inline-reading-settings .reading-label { font-size: .85rem; }
    .inline-reading-settings .size-button { min-width: 3.5rem; padding: .3rem .55rem; }
    .toolbar { display: grid; grid-template-columns: repeat(3, minmax(140px, 1fr)); gap: .8rem; padding: 1rem; margin-bottom: 1rem; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgb(55 45 30 / 8%); }
    .toolbar label { font-weight: 650; }
    select, input[type="search"] { width: 100%; margin-top: .25rem; padding: .65rem .75rem; border: 1px solid #cfc7bb; border-radius: 8px; background: #fff; font: inherit; }
    .search { grid-column: 1 / -1; }
    .hidden { display: none; }
    .folder { overflow: hidden; margin-bottom: .8rem; border: 1px solid #ded7cc; border-radius: 12px; background: #fff; box-shadow: 0 1px 4px rgb(55 45 30 / 6%); }
    .folder-button { display: flex; width: 100%; align-items: center; gap: .7rem; padding: 1rem 1.1rem; border: 0; color: inherit; background: transparent; text-align: left; cursor: pointer; font: inherit; }
    .folder-button:hover { background: #fffaf0; }
    .folder-icon { font-size: 1.3rem; }
    .folder-title { flex: 1; font-weight: 750; }
    .chevron { transition: transform .18s; }
    .folder.open .chevron { transform: rotate(90deg); }
    .folder-content { display: none; padding: 0 1rem 1rem; }
    .folder.open .folder-content { display: grid; gap: .6rem; }
    .day { padding: .85rem 1rem; border-left: 4px solid #c4a45c; border-radius: 7px; background: #faf8f4; }
    .weekday { border-left-color: #7d9a83; }
    .day h3 { margin: 0 0 .35rem; font-size: 1rem; }
    .homily-card { overflow: hidden; margin-top: .6rem; border: 1px solid #ddd4c6; border-radius: 7px; background: #fff; }
    .homily-toggle { display: flex; width: 100%; align-items: center; gap: .7rem; padding: .8rem; border: 0; color: inherit; background: #fff; text-align: left; cursor: pointer; font: inherit; }
    .homily-toggle:hover { background: #fffaf0; }
    .homily-title { flex: 1; font-weight: 750; }
    .homily-meta { color: #756d61; font-size: .82rem; }
    .homily-body { display: none; padding: 0 .8rem .9rem; border-top: 1px solid #eee7dd; }
    .homily-card.open .homily-body { display: block; }
    .homily-card.open .chevron { transform: rotate(90deg); }
    .homily-collapse { display: block; width: 100%; margin-top: 1rem; padding: .6rem; border: 1px solid #cdbfAA; border-radius: 7px; color: #5c461d; background: #fff8e8; cursor: pointer; font: inherit; font-weight: 700; }
    .homily-collapse:hover { background: #f8edcf; }
    .notes { margin: 0; font-size: var(--reading-font-size); line-height: var(--reading-line-height); white-space: pre-wrap; }
    .empty-note { color: #8b857d; }
    .keywords { margin-top: .5rem; }
    .keyword { display: inline-block; padding: .1rem .5rem; margin: .1rem .15rem 0 0; border-radius: 999px; background: #e9e4da; font-size: .8rem; }
    .message { padding: 2rem; color: #6d675e; text-align: center; }
    .error { color: #a32c2c; }
    @media (max-width: 650px) { body { padding: 1rem; } .toolbar { grid-template-columns: 1fr; } .search { grid-column: auto; } }
  </style>
</head>
<body>
  <a class="back" href="index.html#home">← 回首頁</a>
  <h1>講道與道理筆記</h1>
  <p class="subtitle">每個禮儀年分為主日、平日與其他節日資料夾</p>
  <p id="offlineStatus" role="status" aria-live="polite"></p>
  <div id="currentCycle" class="current"></div>
  <div class="reading-settings" aria-label="閱讀字體大小">
    <span class="reading-label">閱讀字體</span>
    <button class="size-button" type="button" data-size-control data-size="small" aria-pressed="false">小字</button>
    <button class="size-button" type="button" data-size-control data-size="medium" aria-pressed="true">標準</button>
    <button class="size-button" type="button" data-size-control data-size="large" aria-pressed="false">大字</button>
  </div>

  <div class="toolbar">
    <label id="cycleLabel">
      禮儀年
      <select id="cycleSelect">
        <option value="a">甲年</option>
        <option value="b">乙年</option>
        <option value="c">丙年</option>
      </select>
    </label>
    <label>
      類別
      <select id="sectionSelect">
        <option value="sundays">主日</option>
        <option value="weekdays">平日</option>
        <option value="advent-weekdays">將臨期平日</option>
        <option value="other">其他（各種節日）</option>
        <option value="apostles">12宗徒（獨立分類）</option>
        <option value="marian">聖母其他節日（獨立分類）</option>
        <option value="theology">其他神學與生活道理（獨立分類）</option>
      </select>
    </label>
    <label id="parityLabel" class="hidden">
      平日週期
      <select id="paritySelect">
        <option value="odd">單數年</option>
        <option value="even">雙數年</option>
      </select>
    </label>
    <label class="search">
      搜尋資料夾或筆記
      <input type="search" id="searchInput" placeholder="例如：第5主日、聖誕、祈禱">
    </label>
  </div>

  <main id="list"><div class="message">載入中…</div></main>

  <div id="backupTools"></div>
  <script src="backup.js"></script>

  <script>
    const cycleSelect = document.getElementById('cycleSelect');
    const sectionSelect = document.getElementById('sectionSelect');
    const paritySelect = document.getElementById('paritySelect');
    const parityLabel = document.getElementById('parityLabel');
    const searchInput = document.getElementById('searchInput');
    const currentCycle = document.getElementById('currentCycle');
    const listEl = document.getElementById('list');
    const sizeButtons = document.querySelectorAll('.reading-settings .size-button');
    let cycleData;
    let detected;

    function setReadingSize(size) {
      const allowed = ['small', 'medium', 'large'];
      const selected = allowed.includes(size) ? size : 'medium';
      document.body.dataset.readingSize = selected;
      document.querySelectorAll('[data-size-control]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.size === selected));
      });
      try { localStorage.setItem('homily-reading-size', selected); } catch (_) {}
    }

    function firstSundayOfAdvent(year) {
      const date = new Date(year, 10, 27);
      date.setDate(date.getDate() + ((7 - date.getDay()) % 7));
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function liturgicalSettings(date = new Date()) {
      const calendarYear = date.getFullYear();
      const liturgicalYear = date >= firstSundayOfAdvent(calendarYear) ? calendarYear + 1 : calendarYear;
      return {
        liturgicalYear,
        sunday: liturgicalYear % 3 === 1 ? 'a' : liturgicalYear % 3 === 2 ? 'b' : 'c',
        weekday: liturgicalYear % 2 === 1 ? 'odd' : 'even'
      };
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[char]);
    }

    function formatUploadTime(value) {
      if (!value) return '未記錄上傳時間';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat('zh-TW', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      }).format(date);
    }

    function homilyBlock(item, title, cssClass = '') {
      const homilies = item.homilies || [];
      return `
        <article class="day ${cssClass}">
          <h3>${escapeHtml(title)}</h3>
          ${homilies.length ? homilies.map((homily, index) => `
            <section class="homily-card" data-homily-title="${escapeHtml(homily.title)}" data-homily-index="${index + 1}" data-reading-language="zh" data-original-language="${escapeHtml(homily.original_language || 'zh')}">
              <button class="homily-toggle" type="button" aria-expanded="false">
                <span class="homily-title">${index + 1}. ${escapeHtml(homily.title)}</span>
                <span class="homily-meta">${escapeHtml(formatUploadTime(homily.uploaded_at))}</span>
                <span class="chevron">›</span>
              </button>
              <div class="homily-body">
                <div class="inline-reading-settings" aria-label="這篇道理的字體大小">
                  <span class="reading-label">字體</span>
                  <button class="size-button" type="button" data-size-control data-size="small" aria-pressed="false">小字</button>
                  <button class="size-button" type="button" data-size-control data-size="medium" aria-pressed="false">標準</button>
                  <button class="size-button" type="button" data-size-control data-size="large" aria-pressed="false">大字</button>
                </div>
                ${homily.translations?.en?.title && homily.translations.en.content ? `
                  <label class="homily-language-label">語言 / Language <select class="homily-language"><option value="zh">${homily.original_language === 'en' ? '中文翻譯' : '中文原文'}</option><option value="en">${homily.original_language === 'en' ? 'English（原文）' : 'English'}</option></select></label>
                  <div class="homily-translation-source" hidden data-language="zh" data-title="${escapeHtml(homily.title)}">${escapeHtml(homily.content)}</div>
                  <div class="homily-translation-source" hidden data-language="en" data-title="${escapeHtml(homily.translations.en.title)}">${escapeHtml(homily.translations.en.content)}</div>
                ` : ''}
                <div class="homily-actions"><button type="button" class="reader-open">全螢幕閱讀</button><button type="button" class="homily-copy">複製全文</button><button type="button" class="homily-listen">朗讀道理</button></div>
                <p class="reading-hint">雙擊道理標題或正文進入全螢幕；全螢幕內再雙擊道理，即可返回。</p>
                <p class="copy-status" role="status" aria-live="polite"></p>
                <p class="notes">${escapeHtml(homily.content)}</p>
                <button class="homily-collapse" type="button">↑ 收合這篇道理</button>
              </div>
            </section>
          `).join('') : '<p class="empty-note">尚未加入道理</p>'}
        </article>
      `;
    }

    function folderHtml(title, body) {
      return `
        <section class="folder">
          <button class="folder-button" type="button" aria-expanded="false">
            <span class="folder-icon">📁</span>
            <span class="folder-title">${escapeHtml(title)}</span>
            <span class="chevron">›</span>
          </button>
          <div class="folder-content">${body}</div>
        </section>
      `;
    }

    function selectedItems() {
      if (!cycleData) return [];
      if (['apostles', 'marian', 'theology'].includes(sectionSelect.value)) return cycleData.folders;
      if (sectionSelect.value === 'advent-weekdays') return cycleData.advent_weekdays?.weeks || [];
      if (sectionSelect.value === 'sundays') return cycleData.sundays;
      if (sectionSelect.value === 'other') return cycleData.other;
      return cycleData.weekdays[paritySelect.value].weeks;
    }

    function render() {
      document.getElementById('cycleLabel').hidden = ['apostles', 'marian', 'theology'].includes(sectionSelect.value);
      currentCycle.hidden = ['apostles', 'marian', 'theology'].includes(sectionSelect.value);
      parityLabel.classList.toggle('hidden', sectionSelect.value !== 'weekdays');
      const query = searchInput.value.trim().toLowerCase();
      const items = selectedItems().filter(item => {
        const days = item.days || [];
        const homilyText = entry => (entry.homilies || []).flatMap(homily => [
          homily.title, homily.uploaded_at, homily.content,
          ...Object.values(homily.translations || {}).flatMap(translation => [translation.title, translation.content])
        ]);
        const text = [item.name, item.display_name, ...homilyText(item), ...days.flatMap(day => [day.label, ...homilyText(day)])].join(' ').toLowerCase();
        return !query || text.includes(query);
      });

      if (!items.length) {
        listEl.innerHTML = '<div class="message">沒有符合的資料夾或筆記</div>';
        return;
      }

      listEl.innerHTML = items.map(item => {
        if (['weekdays', 'advent-weekdays'].includes(sectionSelect.value)) {
          return folderHtml(item.name, item.days.map(day => homilyBlock(day, day.label, 'weekday')).join(''));
        }
        return folderHtml(item.display_name, homilyBlock(item, item.name));
      }).join('');

      listEl.querySelectorAll('.folder-button').forEach(button => {
        button.addEventListener('click', () => {
          const folder = button.closest('.folder');
          const open = folder.classList.toggle('open');
          button.setAttribute('aria-expanded', String(open));
        });
      });
      listEl.querySelectorAll('.homily-toggle').forEach(button => {
        button.addEventListener('click', () => {
          const card = button.closest('.homily-card');
          const open = card.classList.toggle('open');
          button.setAttribute('aria-expanded', String(open));
        });
      });
      listEl.querySelectorAll('.homily-collapse').forEach(button => {
        button.addEventListener('click', () => {
          const card = button.closest('.homily-card');
          const toggle = card.querySelector('.homily-toggle');
          card.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
          toggle.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          toggle.focus({ preventScroll: true });
        });
      });
      listEl.querySelectorAll('.inline-reading-settings .size-button').forEach(button => {
        button.addEventListener('click', () => setReadingSize(button.dataset.size));
      });
      setReadingSize(document.body.dataset.readingSize);
    }

    async function loadData() {
      cycleData = null;
      listEl.innerHTML = '<div class="message">載入中…</div>';
      try {
        const selectedCycle = ['apostles', 'marian', 'theology'].includes(sectionSelect.value) ? sectionSelect.value : cycleSelect.value;
        const data = await window.HomilyData.load(selectedCycle);
        if (selectedCycle !== (['apostles', 'marian', 'theology'].includes(sectionSelect.value) ? sectionSelect.value : cycleSelect.value)) return;
        cycleData = data;
        render();
      } catch (error) {
        listEl.innerHTML = `<div class="message error">載入失敗：${escapeHtml(error.message)}</div>`;
      }
    }

    detected = liturgicalSettings();
    let savedReadingSize = 'medium';
    try { savedReadingSize = localStorage.getItem('homily-reading-size') || 'medium'; } catch (_) {}
    setReadingSize(savedReadingSize);
    sizeButtons.forEach(button => {
      button.addEventListener('click', () => setReadingSize(button.dataset.size));
    });
    cycleSelect.value = detected.sunday;
    paritySelect.value = detected.weekday;
    const sundayLabel = { a: '甲年', b: '乙年', c: '丙年' }[detected.sunday];
    const weekdayLabel = detected.weekday === 'odd' ? '單數年' : '雙數年';
    currentCycle.textContent = `目前禮儀年度：${detected.liturgicalYear} 年 · ${sundayLabel}主日 · ${weekdayLabel}平日`;

    window.addEventListener('homily-data-changed', loadData);
    cycleSelect.addEventListener('change', loadData);
    sectionSelect.addEventListener('change', loadData);
    paritySelect.addEventListener('change', render);
    searchInput.addEventListener('input', render);

    loadData();
  </script>
  <script src="narration.js"></script>
  <script src="translations.js"></script>
  <script src="reader.js"></script>
  <script src="offline.js"></script>
</body>
</html>
