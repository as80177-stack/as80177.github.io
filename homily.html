<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>講道與道理筆記</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      max-width: 920px;
      margin: 0 auto;
      padding: 1.5rem;
      line-height: 1.6;
      color: #24211d;
      background: #f7f4ef;
    }
    a.back { display: inline-block; margin-bottom: 1rem; color: #72551f; text-decoration: none; }
    h1 { margin: 0 0 0.25rem; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .subtitle { color: #6d675e; margin: 0 0 1rem; }
    .current {
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      border-left: 4px solid #9b762d;
      border-radius: 6px;
      background: #fff9e9;
    }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(2, minmax(150px, 1fr));
      gap: 0.8rem;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 8px rgb(55 45 30 / 8%);
    }
    .toolbar label { font-weight: 650; }
    select, input[type="search"] {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.65rem 0.75rem;
      border: 1px solid #cfc7bb;
      border-radius: 8px;
      background: #fff;
      font: inherit;
    }
    .search { grid-column: 1 / -1; }
    .folder {
      overflow: hidden;
      margin-bottom: 0.8rem;
      border: 1px solid #ded7cc;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 1px 4px rgb(55 45 30 / 6%);
    }
    .folder-button {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 0.8rem;
      padding: 1rem 1.1rem;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .folder-button:hover { background: #fffaf0; }
    .folder-icon { font-size: 1.35rem; }
    .folder-title { flex: 1; font-weight: 750; }
    .season { color: #756d61; font-size: 0.9rem; }
    .chevron { transition: transform 0.18s; }
    .folder.open .chevron { transform: rotate(90deg); }
    .days { display: none; padding: 0 1rem 1rem; }
    .folder.open .days { display: grid; gap: 0.65rem; }
    .day {
      padding: 0.85rem 1rem;
      border-left: 4px solid #c4a45c;
      border-radius: 7px;
      background: #faf8f4;
    }
    .day.weekday { border-left-color: #7d9a83; }
    .day h3 { margin: 0 0 0.35rem; font-size: 1rem; }
    .notes { margin: 0; white-space: pre-wrap; }
    .empty-note { color: #8b857d; }
    .keywords { margin-top: 0.5rem; }
    .keyword {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      margin: 0.1rem 0.15rem 0 0;
      border-radius: 999px;
      background: #e9e4da;
      font-size: 0.8rem;
    }
    .message { padding: 2rem; color: #6d675e; text-align: center; }
    .error { color: #a32c2c; }
    @media (max-width: 560px) {
      body { padding: 1rem; }
      .toolbar { grid-template-columns: 1fr; }
      .search { grid-column: auto; }
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← 回首頁</a>
  <h1>講道與道理筆記</h1>
  <p class="subtitle">主日採甲、乙、丙年；平日採單數年、雙數年</p>

  <div id="currentCycle" class="current"></div>

  <div class="toolbar">
    <label>
      主日禮儀年
      <select id="sundayCycle">
        <option value="a">甲年</option>
        <option value="b">乙年</option>
        <option value="c">丙年</option>
      </select>
    </label>
    <label>
      平日讀經年
      <select id="weekdayCycle">
        <option value="odd">單數年</option>
        <option value="even">雙數年</option>
      </select>
    </label>
    <label class="search">
      搜尋資料夾或筆記
      <input type="search" id="searchInput" placeholder="例如：將臨期、祈禱、星期一">
    </label>
  </div>

  <main id="list"><div class="message">載入中…</div></main>

  <script>
    const sundayCycle = document.getElementById('sundayCycle');
    const weekdayCycle = document.getElementById('weekdayCycle');
    const searchInput = document.getElementById('searchInput');
    const currentCycle = document.getElementById('currentCycle');
    const listEl = document.getElementById('list');
    let mergedWeeks = [];

    function firstSundayOfAdvent(year) {
      const date = new Date(year, 10, 27);
      date.setDate(date.getDate() + ((7 - date.getDay()) % 7));
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function liturgicalSettings(date = new Date()) {
      const calendarYear = date.getFullYear();
      const liturgicalYear = date >= firstSundayOfAdvent(calendarYear)
        ? calendarYear + 1
        : calendarYear;
      const sunday = liturgicalYear % 3 === 1 ? 'a'
        : liturgicalYear % 3 === 2 ? 'b'
        : 'c';
      const weekday = liturgicalYear % 2 === 1 ? 'odd' : 'even';
      return { liturgicalYear, sunday, weekday };
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[char]);
    }

    function labels() {
      return {
        sunday: { a: '甲年', b: '乙年', c: '丙年' }[sundayCycle.value],
        weekday: { odd: '單數年', even: '雙數年' }[weekdayCycle.value]
      };
    }

    async function loadData() {
      listEl.innerHTML = '<div class="message">載入中…</div>';
      try {
        const [sundayResponse, weekdayResponse] = await Promise.all([
          fetch(`data/year-${sundayCycle.value}.json`),
          fetch(`data/year-${weekdayCycle.value}.json`)
        ]);
        if (!sundayResponse.ok || !weekdayResponse.ok) throw new Error('找不到週期資料檔');
        const [sundayData, weekdayData] = await Promise.all([
          sundayResponse.json(), weekdayResponse.json()
        ]);
        const weekdaysById = new Map(weekdayData.weeks.map(week => [week.id, week.days]));
        mergedWeeks = sundayData.weeks.map(week => ({
          ...week,
          days: [...week.days, ...(weekdaysById.get(week.id) || [])]
        }));
        render();
      } catch (error) {
        listEl.innerHTML = `<div class="message error">載入失敗：${escapeHtml(error.message)}</div>`;
      }
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const visible = mergedWeeks.filter(week => {
        const text = [
          week.name, week.season,
          ...week.days.flatMap(day => [day.label, day.homily_notes, ...(day.keywords || [])])
        ].join(' ').toLowerCase();
        return !query || text.includes(query);
      });

      if (!visible.length) {
        listEl.innerHTML = '<div class="message">沒有符合的資料夾或筆記</div>';
        return;
      }

      const cycleLabels = labels();
      listEl.innerHTML = visible.map(week => `
        <section class="folder">
          <button class="folder-button" type="button" aria-expanded="false">
            <span class="folder-icon">📁</span>
            <span class="folder-title">${escapeHtml(week.name)}</span>
            <span class="season">${escapeHtml(week.season)}</span>
            <span class="chevron">›</span>
          </button>
          <div class="days">
            ${week.days.map(day => {
              const isSunday = day.id === 'sunday';
              const cycle = isSunday ? cycleLabels.sunday : cycleLabels.weekday;
              const note = day.homily_notes?.trim();
              return `
                <article class="day ${isSunday ? '' : 'weekday'}">
                  <h3>${escapeHtml(day.label)} · ${escapeHtml(cycle)}</h3>
                  <p class="notes ${note ? '' : 'empty-note'}">${escapeHtml(note || '尚未加入筆記')}</p>
                  ${day.keywords?.length ? `
                    <div class="keywords">
                      ${day.keywords.map(keyword => `<span class="keyword">${escapeHtml(keyword)}</span>`).join('')}
                    </div>
                  ` : ''}
                </article>
              `;
            }).join('')}
          </div>
        </section>
      `).join('');

      listEl.querySelectorAll('.folder-button').forEach(button => {
        button.addEventListener('click', () => {
          const folder = button.closest('.folder');
          const open = folder.classList.toggle('open');
          button.setAttribute('aria-expanded', String(open));
        });
      });
    }

    const detected = liturgicalSettings();
    sundayCycle.value = detected.sunday;
    weekdayCycle.value = detected.weekday;
    currentCycle.textContent =
      `目前禮儀年度：${detected.liturgicalYear} 年 · ${labels().sunday}主日 · ${labels().weekday}平日`;

    sundayCycle.addEventListener('change', loadData);
    weekdayCycle.addEventListener('change', loadData);
    searchInput.addEventListener('input', render);
    loadData();
  </script>
</body>
</html>
